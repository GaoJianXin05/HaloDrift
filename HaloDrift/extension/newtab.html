<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>New Tab</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <section class="hero" id="hero">
      <h1 class="brand" id="brand" aria-label="Google"><span class="glow" aria-hidden="true">Google</span><span class="word" aria-hidden="true">Google</span></h1>
    </section>

    <form class="search" id="searchForm" autocomplete="off" role="search">
      <span class="ring" aria-hidden="true"></span>
      <span class="halo" aria-hidden="true"></span>
      <button type="button" class="engine" id="engineBtn" aria-haspopup="listbox" aria-expanded="false" data-i18n-title="engine.switch">
        <span class="engine-icon" id="engineIcon"></span>
        <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <input id="q" type="text" spellcheck="false" data-i18n-aria="search">
      <kbd class="hint" id="hint">/</kbd>
      <button type="submit" class="go" data-i18n-aria="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <ul class="engine-menu" id="engineMenu" role="listbox" data-i18n-aria="engines"></ul>
    </form>

    <nav class="tiles" id="tiles" data-i18n-aria="shortcuts"></nav>
  </main>

  <button class="fab" id="settingsBtn" data-i18n-aria="settings.open" data-i18n-title="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
  </button>

  <aside class="panel" id="panel" data-i18n-aria="settings" aria-hidden="true">
    <header class="panel-head">
      <h2 data-i18n="panel.title"></h2>
      <div class="lang-toggle" id="langToggle" role="radiogroup" data-i18n-aria="lang">
        <button type="button" role="radio" data-lang="zh" lang="zh-CN">中</button>
        <button type="button" role="radio" data-lang="en" lang="en">EN</button>
      </div>
      <button class="icon-btn" id="closePanel" data-i18n-aria="settings.close">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="panel-body">
      <section class="group">
        <h3 data-i18n="grp.palette"></h3>
        <div class="swatches" id="swatches"></div>
      </section>

      <section class="group">
        <h3 data-i18n="grp.motion"></h3>
        <label class="row"><span data-i18n="speed"></span><input type="range" id="speed" min="0" max="2.5" step="0.05"></label>
        <label class="row"><span data-i18n="intensity"></span><input type="range" id="intensity" min="0.3" max="1.6" step="0.05"></label>
        <label class="row"><span data-i18n="quality"></span>
          <select id="quality">
            <option value="high" data-i18n="q.high"></option>
            <option value="balanced" data-i18n="q.balanced"></option>
            <option value="eco" data-i18n="q.eco"></option>
          </select>
        </label>
        <label class="row"><span data-i18n="mouse"></span><input type="range" id="mouse" min="0" max="2" step="0.05"></label>
        <label class="row switch"><span data-i18n="grain"></span><input type="checkbox" id="grain"><i></i></label>
      </section>

      <section class="group">
        <h3 data-i18n="grp.content"></h3>
        <label class="row switch"><span data-i18n="showBrand"></span><input type="checkbox" id="showBrand"><i></i></label>
        <label class="row"><span data-i18n="iconStyle"></span>
          <select id="iconStyle">
            <option value="logo" data-i18n="is.logo"></option>
            <option value="mono" data-i18n="is.mono"></option>
          </select>
        </label>
        <label class="row switch"><span data-i18n="showTiles"></span><input type="checkbox" id="showTiles"><i></i></label>
      </section>

      <section class="group">
        <h3 data-i18n="grp.search"></h3>
        <label class="row"><span data-i18n="engineSel"></span><select id="engineSel"></select></label>
        <label class="row"><span data-i18n="openMode"></span>
          <select id="openMode">
            <option value="tab" data-i18n="om.tab"></option>
            <option value="window" data-i18n="om.window"></option>
            <option value="self" data-i18n="om.self"></option>
          </select>
        </label>
      </section>

      <button class="ghost-btn" id="refreshIcons" data-i18n="refresh"></button>
      <button class="ghost-btn" id="resetBtn" data-i18n="reset"></button>
      <p class="foot" id="version">Halo Drift</p>
      <p class="foot" data-i18n="tips"></p>
    </div>
  </aside>

  <div class="modal" id="modal" aria-hidden="true">
    <form class="card" id="tileForm">
      <h2 id="modalTitle"></h2>
      <label><span data-i18n="f.name"></span><input id="tileName" type="text" required maxlength="24" data-i18n-ph="f.name.ph"></label>
      <label><span data-i18n="f.url"></span><input id="tileUrl" type="text" required placeholder="https://huggingface.co"></label>
      <div class="field">
        <span data-i18n="f.icon"></span>
        <div class="picker" id="iconPicker" role="radiogroup" data-i18n-aria="f.icon"></div>
      </div>
      <label><span data-i18n="f.iconUrl"></span><input id="tileIcon" type="text" placeholder="https://…/icon.png"></label>
      <div class="actions">
        <button type="button" class="ghost-btn" id="cancelTile" data-i18n="cancel"></button>
        <button type="submit" class="solid-btn" id="saveTile"></button>
      </div>
    </form>
  </div>

  <script src="i18n.js"></script>
  <script src="aurora.js"></script>
  <script src="glyphs.js"></script>
  <script src="app.js"></script>
</body>
</html>
